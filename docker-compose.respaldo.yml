# ============================================================
# EstacionaYa · API de negocio
#
# Supabase NO se levanta aquí: se administra con el Supabase CLI
# (`supabase start`), que ya maneja su propio stack de Docker
# (Postgres, Auth, Realtime, Studio, etc.). Este compose es solo
# para la API de negocio. La visión se ejecuta en el host para acceder
# de forma fiable a la webcam.
# ============================================================
version: "3.9"

services:
  api:
    build:
      context: ./api
    container_name: estacionaya_api
    restart: unless-stopped
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
