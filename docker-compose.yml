
# ============================================================
# ESTACIONAYA - DOCKER COMPOSE
# API FastAPI + conexion con Supabase
#
# Supabase se administra por separado con Supabase CLI.
# La vision EZVIZ + YOLOv8 se ejecuta en Windows.
# ============================================================

services:
  api:
    build:
      context: ./api

    container_name: estacionaya_api

    restart: unless-stopped

    volumes:
      - ./api:/app

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ./api/.env

    environment:
      SUPABASE_URL: http://supabase_kong_estacionaya:8000

    networks:
      - default
      - supabase_network_estacionaya

networks:
  default:

  supabase_network_estacionaya:
    external: true
    name: supabase_network_estacionaya
